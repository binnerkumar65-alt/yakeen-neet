<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B0E1A;
    --bg-raised:#131826;
    --bg-raised2:#1A2032;
    --ink:#F2F4F8;
    --ink-soft:#8A93A6;
    --line:#232A3B;

    --physics:#F5A524;
    --physics-tint:rgba(245,165,36,.14);
    --biology:#E23FA0;
    --biology-tint:rgba(226,63,160,.14);
    --chemistry:#22C55E;
    --chemistry-tint:rgba(34,197,94,.14);

    --live:#EF4444;
    --ended:#6B7280;
    --upcoming:#3B82F6;

    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:40px;
  }

  header.topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    padding:20px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  h1.brand{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:24px;
    margin:0;
    letter-spacing:-.01em;
  }

  .topbar-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .visit-badge{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:500;
    color:var(--ink-soft);
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 12px;
    white-space:nowrap;
    flex-shrink:0;
    margin-top:2px;
  }
  .dot-green{
    width:7px;height:7px;border-radius:50%;
    background:#22C55E;
    flex-shrink:0;
  }

  .crumbrow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .backbtn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    padding:6px 0;
  }
  .backbtn svg{width:16px;height:16px;}

  main{padding:18px 20px 8px;}

  .section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:17px;
    margin:4px 0 14px;
  }
  .dot-red{
    width:8px;height:8px;border-radius:50%;
    background:var(--live);
    box-shadow:0 0 0 0 rgba(239,68,68,.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(239,68,68,.5);}
    70%{box-shadow:0 0 0 8px rgba(239,68,68,0);}
    100%{box-shadow:0 0 0 0 rgba(239,68,68,0);}
  }

  /* ---------- Live Classes row ---------- */
  .live-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:28px;
    scroll-snap-type:x mandatory;
  }
  .live-row::-webkit-scrollbar{height:0;}
  .live-card{
    flex:0 0 auto;
    width:180px;
    scroll-snap-align:start;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:var(--ink);
    display:block;
  }
  .live-thumb{
    height:96px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--tint) 0%, var(--bg-raised2) 100%);
    overflow:hidden;
  }
  .live-thumb-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    z-index:0;
  }
  .live-badge{
    position:absolute;
    top:8px; left:8px;
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:.04em;
    padding:4px 8px;
    border-radius:999px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);
  }
  .live-badge.is-live{color:var(--live);}
  .live-badge.is-ended{color:var(--ended);}
  .live-badge.is-upcoming{color:var(--upcoming);}
  .live-badge .bdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .live-badge .bdot.blink{animation:pulse 1.6s infinite;}
  .play-icon{
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.95);
    display:flex;align-items:center;justify-content:center;
  }
  .play-icon svg{width:13px;height:13px;margin-left:2px;}

  .live-info{padding:10px 11px 12px;}
  .live-title{font-size:13px;font-weight:600;line-height:1.3;}
  .live-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .live-card.disabled{cursor:default;opacity:.85;}

  /* ---------- Subject cards ---------- */
  .subject-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .subject-card:active{transform:scale(.98);}
  .subject-icon{
    width:52px;height:52px;
    border-radius:12px;
    border:1.5px solid var(--accent);
    background:var(--tint);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:20px;
    flex-shrink:0;
  }
  .subject-card.physics{--accent:var(--physics); --tint:var(--physics-tint);}
  .subject-card.chemistry{--accent:var(--chemistry); --tint:var(--chemistry-tint);}
  .subject-card.biology{--accent:var(--biology); --tint:var(--biology-tint);}

  .subject-text{flex:1;}
  .subject-name{font-family:'Poppins',sans-serif;font-weight:600;font-size:17px;}
  .subject-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .chev{color:var(--ink-soft); flex-shrink:0;}

  /* ---------- Chapter rows ---------- */
  .chapter-row{
    display:flex;
    align-items:stretch;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:10px;
    cursor:pointer;
  }
  .chapter-row:active{transform:scale(.98);}
  .chapter-row .spine{width:6px;background:var(--accent);}
  .chapter-row.physics{--accent:var(--physics);}
  .chapter-row.chemistry{--accent:var(--chemistry);}
  .chapter-row.biology{--accent:var(--biology);}
  .chapter-body{
    flex:1;
    padding:15px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .chapter-name{font-weight:600; font-size:15px;}
  .chapter-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
  }

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab-btn.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  /* ---------- Video list rows ---------- */
  .video-list-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    margin-bottom:10px;
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
  }
  .video-list-row:active{transform:scale(.98);}
  .video-thumb-img{
    width:100px;
    height:66px;
    border-radius:8px;
    object-fit:cover;
    background:var(--bg-raised2);
    flex-shrink:0;
  }
  .video-row-info{flex:1; min-width:0;}
  .video-row-title{
    font-size:13.5px;
    font-weight:600;
    line-height:1.32;
    white-space:normal;
    word-break:break-word;
  }
  .video-row-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:5px;
  }
  .row-chev{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--bg-raised2);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--ink-soft);
  }

  /* ---------- In-page video player ---------- */
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:12px;
    overflow:hidden;
    background:#000;
    margin-bottom:16px;
  }
  .player-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
  }
  .player-title{
    font-size:14px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink-soft);
  }

  /* ---------- Doc list ---------- */
  .doc-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
    text-decoration:none;
    color:var(--ink);
  }
  .doc-icon{
    width:38px;height:38px;border-radius:9px;
    background:var(--tint); color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .doc-icon svg{width:18px;height:18px;}
  .doc-name{font-size:13px;font-weight:500;line-height:1.35;}
  .doc-size{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-family:'Poppins',sans-serif;font-weight:600;font-size:17px;color:var(--ink);margin-bottom:6px;}

  .view{animation:rise .28s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.view{animation:none;} .subject-card,.chapter-row{transition:none;}}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <p class="eyebrow" id="eyebrow">Study Vault</p>
        <h1 class="brand" id="brandTitle">Home</h1>
      </div>
      <div class="visit-badge" id="visitBadge">
        <span class="dot-green"></span> Today: <span id="visitCountText">--</span>
      </div>
    </div>
    <div class="crumbrow" id="crumbrow" style="display:none;">
      <button class="backbtn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
    </div>
  </header>

  <main id="mainView"></main>
</div>

<script>
/* =========================================================================
   Sirf Firebase Realtime Database ka URL daalna hai (Firebase Console ->
   Realtime Database -> upar dikhne wala link).
   Rules me "stream_links", "chapters" aur "live_classes" par public read
   (".read": true) hona zaroori hai.
   ========================================================================= */
const DATABASE_URL = "https://newfire-2258c-default-rtdb.firebaseio.com";

/* Backend base URL - jahan tumhara main.py (FastAPI) deployed hai */
const STREAM_BASE = "https://tg-stream-bot-n02b.onrender.com";

const SUBJECTS = ["Physics", "Chemistry", "Biology"];
const VIDEO_EXT = [".mp4",".mkv",".mov",".avi",".webm",".m4v",".3gp"];

let library = { Physics:{}, Chemistry:{}, Biology:{} };
let liveClasses = [];
let state = { screen:"home", subject:null, chapter:null, tab:"videos" };
let stack = [];

const mainView = document.getElementById("mainView");
const eyebrow = document.getElementById("eyebrow");
const brandTitle = document.getElementById("brandTitle");
const crumbrow = document.getElementById("crumbrow");
const backBtn = document.getElementById("backBtn");

backBtn.addEventListener("click", () => {
  const prev = stack.pop();
  if (prev) { state = prev; render(); }
});

function isVideo(item){
  const mt = (item.mime_type||"");
  const fn = (item.file_name||"").toLowerCase();
  return mt.startsWith("video/") || VIDEO_EXT.some(ext => fn.endsWith(ext));
}

function fmtSize(bytes){
  if (!bytes) return "";
  const mb = bytes / (1024*1024);
  if (mb < 1) return Math.round(bytes/1024) + " KB";
  if (mb < 1024) return mb.toFixed(1) + " MB";
  return (mb/1024).toFixed(2) + " GB";
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

/* ---------------- Live class status logic ----------------
   - video_link khaali/missing              -> UPCOMING (blue)
   - video_link maujood + upcoming != false -> LIVE (red)
   - video_link maujood + upcoming == false -> CLASS ENDED (grey, thumbnail
     wahi rehta hai, sirf badge aur click-ability badalti hai)
------------------------------------------------------------- */
function liveStatus(cls){
  if (!cls.video_link) return "upcoming";
  if (cls.upcoming === false) return "ended";
  return "live";
}

/* ---------------- Data fetch (REST, sirf databaseURL se) ---------------- */
async function loadLibrary(){
  try {
    const res = await fetch(`${DATABASE_URL}/stream_links.json`, { cache:"no-store" });
    if (!res.ok) throw new Error("stream_links fetch failed: " + res.status);
    const data = await res.json() || {};

    const now = Date.now()/1000;
    const fresh = { Physics:{}, Chemistry:{}, Biology:{} };

    Object.entries(data).forEach(([token, item]) => {
      if (!item || !item.subject || !fresh[item.subject]) return;
      if (item.expires_at && item.expires_at < now) return;
      const chapter = item.chapter || "Uncategorised";
      if (!fresh[item.subject][chapter]) fresh[item.subject][chapter] = [];
      fresh[item.subject][chapter].push({ token, ...item });
    });

    library = fresh;
    // Player screen (video playing in iframe) ko background-refresh se
    // touch nahi karte, warna iframe reload ho kar video restart ho jaati hai.
    if (state.screen !== "player") render();
  } catch (err){
    console.error("Library load error:", err);
    if (state.screen === "home"){
      mainView.innerHTML = `<div class="view empty">
        <div class="big">Data load nahi ho paya</div>
        Database URL ya Firebase Rules check karo (console me error dekho).
      </div>`;
    }
  }
}

let lastKnownThumbLink = {}; // frame id -> last non-empty video_link (thumbnail persistence)

async function loadLiveClasses(){
  try {
    const res = await fetch(`${DATABASE_URL}/live_classes.json`, { cache:"no-store" });
    if (!res.ok) throw new Error("live_classes fetch failed: " + res.status);
    const data = await res.json() || {};
    liveClasses = Object.entries(data).map(([id, cls]) => {
      if (cls.video_link) lastKnownThumbLink[id] = cls.video_link;
      return { id, ...cls, _thumbLink: cls.video_link || lastKnownThumbLink[id] || "" };
    });
    if (state.screen === "home") render();
  } catch (err){
    console.error("Live classes load error:", err);
    liveClasses = [];
  }
}

/* ---------------- Auto-create 3 live class slots (Physics/Chemistry/
   Biology) if they don't already exist. Runs once when the page opens. ---- */
async function ensureLiveSlots(){
  try {
    const res = await fetch(`${DATABASE_URL}/live_classes.json`, { cache:"no-store" });
    const data = (res.ok ? await res.json() : null) || {};

    for (const subj of SUBJECTS){
      const key = subj.toLowerCase();
      if (data[key]) continue; // already exists, don't overwrite

      await fetch(`${DATABASE_URL}/live_classes/${key}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: `${subj} Live`,
          subject: subj,
          frame_no: 1,
          video_link: "",
          scheduled_at: "",
          upcoming: true,
          ended: false,
        }),
      });
    }
  } catch (err){
    console.error("ensureLiveSlots error:", err);
  }
}

function refreshAll(){
  loadLibrary();
  loadLiveClasses();
  refreshVisitCount();
}

/* ---------------- Daily unique device counter ----------------
   - Har device ka ek fixed ID localStorage me save hota hai (permanent,
     jab tak browser data clear na ho).
   - Us ID ko aaj ki date ke folder me likha jaata hai:
       visits/{YYYY-MM-DD}/{deviceId} = true
     Isse ek device din me sirf 1 baar count hota hai, chahe kitni baar
     bhi site khole.
   - Raat 12 baje date badalte hi naya folder ban jaata hai -> counter
     apne aap 0 se shuru ho jaata hai.
------------------------------------------------------------- */
function getDeviceId(){
  let id = localStorage.getItem("sv_device_id");
  if (!id){
    id = "d_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("sv_device_id", id);
  }
  return id;
}

function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

let visitMarkedForDate = null; // isi date ke liye already mark ho chuka hai kya

async function refreshVisitCount(){
  const visitCountText = document.getElementById("visitCountText");
  const date = todayKey();
  try {
    if (visitMarkedForDate !== date){
      const deviceId = getDeviceId();
      await fetch(`${DATABASE_URL}/visits/${date}/${deviceId}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(true),
      });
      visitMarkedForDate = date;
    }

    const res = await fetch(`${DATABASE_URL}/visits/${date}.json`, { cache: "no-store" });
    const data = (res.ok ? await res.json() : null) || {};
    const count = Object.keys(data).length;
    if (visitCountText) visitCountText.textContent = count;
  } catch (err){
    console.error("Visit count error:", err);
    if (visitCountText) visitCountText.textContent = "0";
  }
}

(async function init(){
  await ensureLiveSlots();
  refreshAll();
  setInterval(refreshAll, 20000); // har 20 second me refresh (near-live)
})();

/* ---------------- Navigation ---------------- */
function goTo(next){
  stack.push({...state});
  state = next;
  render();
}

/* ---------------- Rendering ---------------- */
function render(){
  stopLiveCarousel();
  if (state.screen === "home"){
    eyebrow.textContent = "Study Vault";
    brandTitle.textContent = "Home";
    crumbrow.style.display = "none";
    renderHome();
  } else if (state.screen === "chapters"){
    eyebrow.textContent = state.subject;
    brandTitle.textContent = "Chapters";
    crumbrow.style.display = "flex";
    renderChapters();
  } else if (state.screen === "chapter"){
    eyebrow.textContent = `${state.subject} · ${state.chapter}`;
    brandTitle.textContent = state.chapter;
    crumbrow.style.display = "flex";
    renderChapterDetail();
  } else if (state.screen === "player"){
    eyebrow.textContent = `${state.subject} · ${state.chapter}`;
    brandTitle.textContent = state.playerTitle || "Video";
    crumbrow.style.display = "flex";
    renderPlayer();
  }
}

/* ---------------- Live row auto-carousel (har 3 second me agla frame) ---- */
let liveCarouselInterval = null;
let liveCarouselIndex = 0;

function stopLiveCarousel(){
  if (liveCarouselInterval){
    clearInterval(liveCarouselInterval);
    liveCarouselInterval = null;
  }
}

function startLiveCarousel(){
  const row = document.querySelector(".live-row");
  if (!row) return;
  const cards = row.querySelectorAll(".live-card");
  if (cards.length < 2) return;

  const CARD_STEP = 192; // live-card width (180px) + gap (12px)
  liveCarouselIndex = 0;
  row.scrollLeft = 0;

  liveCarouselInterval = setInterval(() => {
    liveCarouselIndex = (liveCarouselIndex + 1) % cards.length;
    row.scrollTo({ left: liveCarouselIndex * CARD_STEP, behavior: "smooth" });
  }, 3000);
}

function renderLiveRow(){
  if (!liveClasses.length) return "";

  const cards = liveClasses.map(cls => {
    const status = liveStatus(cls);
    const accent = (cls.subject || "physics").toLowerCase();
    let badgeHtml, clickable;

    if (status === "live"){
      badgeHtml = `<span class="bdot blink"></span> LIVE`;
      clickable = true;
    } else if (status === "ended"){
      badgeHtml = `<span class="bdot"></span> CLASS ENDED`;
      clickable = false;
    } else {
      badgeHtml = `<span class="bdot"></span> UPCOMING`;
      clickable = false;
    }

    const videoPreview = cls._thumbLink
      ? `<video class="live-thumb-video" src="${escapeHtml(cls._thumbLink)}" muted playsinline preload="metadata"
          onloadedmetadata="this.currentTime=0.1" onerror="this.remove();"></video>`
      : '';

    const inner = `
      <div class="live-thumb" style="--tint:var(--${accent}-tint)">
        ${videoPreview}
        <span class="live-badge is-${status}">${badgeHtml}</span>
        ${status==='live' ? `<div class="play-icon"><svg viewBox="0 0 24 24" fill="var(--${accent})"><path d="M6 4l14 8-14 8z"/></svg></div>` : ''}
      </div>
      <div class="live-info">
        <div class="live-title">${escapeHtml(cls.title || 'Live Class')}</div>
        <div class="live-meta">${escapeHtml(cls.scheduled_at || '')}</div>
      </div>`;

    return clickable
      ? `<a class="live-card" href="${escapeHtml(cls.video_link)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="live-card disabled">${inner}</div>`;
  }).join("");

  return `
    <div class="section-title"><span class="dot-red"></span> Live Classes</div>
    <div class="live-row">${cards}</div>`;
}

function renderHome(){
  let html = renderLiveRow();
  html += `<div class="section-title">Subjects</div>`;

  SUBJECTS.forEach(subj => {
    const chapters = library[subj] || {};
    const chapterCount = Object.keys(chapters).length;
    html += `
      <div class="subject-card ${subj.toLowerCase()}" onclick="openSubject('${subj}')">
        <div class="subject-icon">${subj[0]}</div>
        <div class="subject-text">
          <div class="subject-name">${subj}</div>
          <div class="subject-meta">Click to view chapters</div>
        </div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
  });
  mainView.innerHTML = `<div class="view">${html}</div>`;
  startLiveCarousel();
}

function openSubject(subj){
  goTo({ screen:"chapters", subject:subj, chapter:null, tab:"videos" });
}

function renderChapters(){
  const chapters = library[state.subject] || {};
  const names = Object.keys(chapters);

  if (names.length === 0){
    mainView.innerHTML = `<div class="view empty">
      <div class="big">Abhi kuch nahi hai</div>
      Is subject me koi chapter add nahi hua.
    </div>`;
    return;
  }

  let html = "";
  names.forEach(chapter => {
    const list = chapters[chapter];
    const videos = list.filter(isVideo).length;
    const docs = list.length - videos;
    html += `
      <div class="chapter-row ${state.subject.toLowerCase()}" onclick="openChapter('${chapter.replace(/'/g,"\\'")}')">
        <div class="spine"></div>
        <div class="chapter-body">
          <div>
            <div class="chapter-name">${chapter}</div>
            <div class="chapter-meta">${videos} video${videos!==1?'s':''} · ${docs} note${docs!==1?'s':''}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink-soft)"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>`;
  });
  mainView.innerHTML = `<div class="view">${html}</div>`;
}

function openChapter(chapter){
  goTo({ screen:"chapter", subject:state.subject, chapter:chapter, tab:"videos" });
}

function setTab(tab){
  state.tab = tab;
  renderChapterDetail();
}

/* ---------------- In-page video player (iframe) ---------------- */
let videoLookup = {}; // token -> {file_name, ...} - filled while rendering lectures list

function openPlayer(token){
  const item = videoLookup[token] || {};
  goTo({
    screen:"player",
    subject:state.subject,
    chapter:state.chapter,
    tab:state.tab,
    playerToken: token,
    playerTitle: item.file_name || "Video",
  });
}

function renderPlayer(){
  const src = `${STREAM_BASE}/stream/${state.playerToken}`;
  mainView.innerHTML = `<div class="view">
    <div class="player-wrap">
      <iframe src="${src}" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="player-title">${escapeHtml(state.playerTitle || "")}</div>
  </div>`;
}

function fmtDate(ts){
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function categoryOf(item){
  if (item.category) return item.category; // "video" | "dpp" | "notes"
  return isVideo(item) ? "video" : "notes"; // backward-compat fallback
}

function renderChapterDetail(){
  const subj = state.subject;
  const list = (library[subj] && library[subj][state.chapter]) || [];
  const lectures = list.filter(i => categoryOf(i) === "video");
  const notes = list.filter(i => categoryOf(i) === "notes");
  const dpp = list.filter(i => categoryOf(i) === "dpp");

  const tabDefs = [
    { key:"videos", label:`Lectures (${lectures.length})` },
    { key:"notes", label:`Notes (${notes.length})` },
    { key:"dpp", label:`DPP (${dpp.length})` },
  ];
  let tabsHtml = `<div class="tabs">` + tabDefs.map(t =>
    `<button class="tab-btn ${state.tab===t.key?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`
  ).join("") + `</div>`;

  let bodyHtml = "";
  if (state.tab === "videos"){
    lectures.forEach(v => { videoLookup[v.token] = v; }); // cache for openPlayer()
    bodyHtml = lectures.length === 0
      ? `<div class="empty"><div class="big">Koi lecture nahi</div>Is chapter me abhi video upload nahi hui.</div>`
      : lectures.map(v => `
        <div class="video-list-row" onclick="openPlayer('${v.token}')">
          <img class="video-thumb-img" src="${STREAM_BASE}/thumb/${v.token}" loading="lazy"
               onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%2266%22><rect width=%22100%22 height=%2266%22 fill=%22%231A2032%22/></svg>';" />
          <div class="video-row-info">
            <div class="video-row-title">${escapeHtml(v.file_name || 'video')}</div>
            <div class="video-row-date">${fmtDate(v.created_at)}</div>
          </div>
          <div class="row-chev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>`).join("");
  } else if (state.tab === "notes"){
    bodyHtml = renderDocList(notes, "Koi notes nahi", "Is chapter me abhi notes upload nahi hui.", subj);
  } else {
    bodyHtml = renderDocList(dpp, "Koi DPP nahi", "Is chapter me abhi DPP upload nahi hui.", subj);
  }

  mainView.innerHTML = `<div class="view">${tabsHtml}${bodyHtml}</div>`;
}

function renderDocList(items, emptyTitle, emptyMsg, subj){
  if (items.length === 0){
    return `<div class="empty"><div class="big">${emptyTitle}</div>${emptyMsg}</div>`;
  }
  const accent = subj.toLowerCase();
  return items.map(d => `
    <a class="doc-row" href="${STREAM_BASE}/stream/${d.token}" target="_blank" rel="noopener">
      <div class="doc-icon" style="--tint:var(--${accent}-tint); --accent:var(--${accent})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
      </div>
      <div>
        <div class="doc-name">${escapeHtml(d.file_name || 'file')}</div>
        <div class="doc-size">${fmtSize(d.file_size)}</div>
      </div>
    </a>`).join("");
}
</script>

    <script>
        function shouldShowPopup() {
            var today = getTodayKey(), slot = getCurrentSlot();
            if (slot === 'night') return false;
            var stored = localStorage.getItem(POPUP_SHOWN_KEY), storedSlot = localStorage.getItem(POPUP_SLOT_KEY);
            if (stored === today && storedSlot === slot) return false;
            return true;
        }

        function markPopupShown() { 
            localStorage.setItem(POPUP_SHOWN_KEY, getTodayKey()); 
            localStorage.setItem(POPUP_SLOT_KEY, getCurrentSlot()); 
        }

        function showTelegramPopup() {
            var popup = document.getElementById('yk-telegram-popup');
            if (!popup) return;
            popup.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            var joinBtn = document.getElementById('yk-telegram-join');
            if (joinBtn) joinBtn.addEventListener('click', function() { markPopupShown(); closePopup(); });
            
            var skipBtn = document.getElementById('yk-telegram-skip');
            if (skipBtn) skipBtn.addEventListener('click', function() { markPopupShown(); closePopup(); });
            
            popup.addEventListener('click', function(e) { if (e.target === popup) { markPopupShown(); closePopup(); } });
            
            document.addEventListener('keydown', function escHandler(e) { 
                if (e.key === 'Escape') { markPopupShown(); closePopup(); document.removeEventListener('keydown', escHandler); } 
            });
        }

        function closePopup() {
            var popup = document.getElementById('yk-telegram-popup');
            if (popup) { popup.style.display = 'none'; document.body.style.overflow = ''; }
        }

        function initTelegramPopup() {
            if (shouldShowPopup()) setTimeout(function() { showTelegramPopup(); }, 1500);
        }

        // DOM Load hone par initialize karne ke liye
        document.addEventListener('DOMContentLoaded', function() {
            initTelegramPopup();
        });
