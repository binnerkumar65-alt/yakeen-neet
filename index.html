<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Telegram Data Feed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #38bdf8; margin-bottom: 20px; }
    #feed { width: 100%; max-width: 600px; }
    .card {
      background-color: #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .card p { margin: 0 0 8px 0; line-height: 1.5; white-space: pre-line; word-break: break-word; }
    a { color: #60a5fa; text-decoration: underline; word-break: break-all; }
    .time { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>

  <h2>Live Telegram Channel Feed</h2>
  <div id="feed">डेटा लोड हो रहा है...</div>

  <script>
    const CHANNEL_NAME = "sxhckfufig"; 

    function linkify(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
    }

    async function fetchTelegramData() {
      const feedContainer = document.getElementById('feed');
      
      // CORS Bypass URL for local file support
      const targetUrl = `https://t.me/s/${CHANNEL_NAME}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Network Error");
        
        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const messages = doc.querySelectorAll('.tgme_widget_message');

        if (messages.length === 0) {
          feedContainer.innerHTML = 'चैनल में अभी कोई मैसेज नहीं मिला।';
          return;
        }

        feedContainer.innerHTML = '';

        Array.from(messages).reverse().forEach(msg => {
          const textElement = msg.querySelector('.tgme_widget_message_text');
          const timeElement = msg.querySelector('.tgme_widget_message_date time');

          if (textElement) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const rawText = textElement.innerText;
            const formattedText = linkify(rawText);
            const timeStr = timeElement ? timeElement.getAttribute('datetime') : '';

            card.innerHTML = `
              <p>${formattedText}</p>
              <div class="time">${timeStr ? new Date(timeStr).toLocaleString() : ''}</div>
            `;
            feedContainer.appendChild(card);
          }
        });
      } catch (error) {
        console.error('Error fetching data:', error);
        feedContainer.innerHTML = 'डेटा लोड करने में समस्या आई। कृपया नेटवर्क चेक करें या GitHub Pages पर चलाएं।';
      }
    }

    fetchTelegramData();
    setInterval(fetchTelegramData, 10000);
  </script>
</body>
</html>
